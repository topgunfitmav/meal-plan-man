<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meal Plan Man — Your Program</title>
<meta name="description" content="Your personal anti-inflammatory, high-protein meal program: every week, recipe and grocery list.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070708; --bg2:#0f0f11; --panel:#141416; --panel2:#1b1b1f; --edge:#26262c; --edge2:#34343c;
  --ink:#f4f1ea; --ink2:#b9b5aa; --muted:#7f7b72;
  --gold:#f2b300; --gold2:#ffd34d; --gold3:#b57f00; --gold4:#6b4a00;
  --p:#4f9cff; --c:#ffb340; --f:#ff5f7e;
  --r:20px; --r2:14px;
  --lift:0 1px 0 rgba(255,255,255,.06) inset, 0 -2px 0 rgba(0,0,0,.5) inset, 0 12px 30px -10px rgba(0,0,0,.8);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,#1a1710 0%,var(--bg) 60%);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,.disp{font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--gold2)}
.hidden{display:none!important}
.app{max-width:980px;margin:0 auto;padding:0 16px 110px}
@media(min-width:760px){.app{padding-bottom:50px}}
::selection{background:var(--gold);color:#000}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:#000;border:1px solid var(--edge2);display:grid;place-items:center;overflow:hidden;box-shadow:var(--lift)}
.brand .logo img{width:40px;height:40px;object-fit:contain;object-position:center top}
.brand h1{font-size:22px;color:#fff}
.brand h1 span{color:var(--gold)}
.brand small{display:block;font-family:"Manrope";font-weight:700;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--panel);border:1px solid var(--edge);color:var(--ink2)}
.pill.ok{color:var(--gold2);border-color:#3d2f05;background:#171306}.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- hero: the logo is the 3D object ---------- */
.hero{position:relative;margin-top:10px;border-radius:30px;overflow:hidden;background:#000;border:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px 34px;box-shadow:0 40px 80px -40px rgba(242,179,0,.25),0 30px 60px -30px #000}
.stage{position:relative;width:100%;height:min(74vw,520px);perspective:1100px;perspective-origin:50% 35%;display:flex;align-items:flex-end;justify-content:center;transform-style:preserve-3d}
/* lit floor: a key light pool the object stands in */
.stage .floor{position:absolute;left:50%;bottom:0;width:140%;height:62%;transform:translateX(-50%) rotateX(72deg);transform-origin:50% 100%;background:radial-gradient(45% 40% at 50% 60%,rgba(242,179,0,.4) 0%,rgba(242,179,0,.12) 40%,transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 64px);mask-image:linear-gradient(to top,#000 20%,transparent 100%);-webkit-mask-image:linear-gradient(to top,#000 20%,transparent 100%)}
.stage .obj{position:relative;width:min(70vw,400px);transform-style:preserve-3d;will-change:transform;margin-bottom:6%;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.stage .emblem{position:relative;transform:translateZ(40px);filter:drop-shadow(0 40px 30px rgba(0,0,0,.95))}
.stage .emblem img{width:100%;height:auto;display:block}
/* key-light sweep, masked to the logo's own alpha so the light lands on the object, nowhere else */
.stage .sweep{position:absolute;inset:0;pointer-events:none;mask-image:var(--m);-webkit-mask-image:var(--m);mask-size:100% 100%;-webkit-mask-size:100% 100%;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.0) 42%,rgba(255,248,220,.55) 50%,rgba(255,255,255,0) 58%,transparent 70%);background-size:300% 100%;background-position:120% 0;mix-blend-mode:screen;animation:sweep 1.4s cubic-bezier(.4,.1,.2,1) .7s 1 both}
@keyframes sweep{from{background-position:120% 0}to{background-position:-20% 0}}
/* floor reflection: mirrored copy, faded and blurred, under the object */
.stage .reflect{position:absolute;left:0;right:0;top:100%;transform:scaleY(-1) translateZ(0);transform-origin:50% 0;opacity:.38;filter:blur(1.2px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 55%);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 55%);pointer-events:none}
.stage .reflect img{width:100%;display:block}
.hero .copy{position:relative;z-index:2;max-width:560px;margin-top:-10px;opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) .35s forwards}
.hero .copy h2{font-size:clamp(30px,5.4vw,52px);color:#fff}
.hero .copy h2 em{font-style:normal;color:var(--gold)}
.hero .copy p{font-size:16px;color:var(--ink2);margin:12px auto 22px;max-width:520px}
.hero .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px}
.hero .chips span{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){.stage .obj,.hero .copy,.stage .sweep{animation:none;opacity:1}.stage .sweep{display:none}}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px;perspective:1200px}
.feature{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:var(--r);padding:18px;box-shadow:var(--lift);transform-style:preserve-3d;position:relative;overflow:hidden}
.feature b{display:block;font-family:"Anton";font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-size:18px;margin-bottom:6px;transform:translateZ(18px)}
.feature span{font-size:13px;color:var(--ink2);transform:translateZ(10px);display:block}
.feature .ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold3));display:grid;place-items:center;font-size:20px;margin-bottom:12px;box-shadow:0 6px 14px -6px var(--gold);transform:translateZ(28px)}

/* ---------- 3D buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:800;font-size:15px;letter-spacing:.01em;position:relative;transition:transform .08s ease-out,box-shadow .08s ease-out,filter .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.btn.primary{color:#1a1200;background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,#d99f00 100%);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 6px 0 var(--gold3),0 14px 24px -8px rgba(242,179,0,.55);transform:translateY(0)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 0 var(--gold3),0 4px 10px -6px rgba(242,179,0,.5)}
.btn.green{color:#fff;background:linear-gradient(180deg,#2c2c33,#1c1c21);border:1px solid var(--edge2);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 5px 0 #0a0a0b,0 12px 20px -8px #000}
.btn.green:hover{border-color:#4a4a55}
.btn.green:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 1px 0 #0a0a0b}
.btn.ghost{color:var(--ink);background:var(--panel);border:1px solid var(--edge2);box-shadow:0 3px 0 #000}
.btn.ghost:hover{background:var(--panel2)}.btn.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.soft{color:var(--ink);background:var(--panel2);border:1px solid var(--edge2);box-shadow:0 3px 0 #000}.btn.soft:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.danger{color:#ff8a8a;border-color:#4a1f1f}

/* ---------- cards + forms ---------- */
.card{background:linear-gradient(170deg,var(--panel2) 0%,var(--panel) 100%);border:1px solid var(--edge);border-radius:var(--r);padding:18px;box-shadow:var(--lift)}
.card+.card{margin-top:12px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.section-title h2{font-size:26px;color:#fff}.section-title .sub{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
label.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 7px}
.field{width:100%;padding:13px 14px;border:1px solid var(--edge2);border-radius:12px;background:#0b0b0d;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s;box-shadow:0 2px 0 rgba(0,0,0,.6) inset}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,179,0,.18)}
.field::placeholder{color:#5c584f}
textarea.field{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.opt{border:1px solid var(--edge2);background:linear-gradient(180deg,#202025,#161619);border-radius:14px;padding:13px;text-align:left;transition:transform .08s,box-shadow .08s,border-color .15s;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 0 #050506,0 10px 16px -10px #000}
.opt b{font-size:14px;color:#fff}.opt span{font-size:12px;color:var(--muted);line-height:1.3}
.opt:hover{border-color:#4a4a55}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #050506}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,#2a2208,#1a1506);box-shadow:0 4px 0 var(--gold4),0 10px 20px -10px rgba(242,179,0,.5)}
.opt.on b{color:var(--gold2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid var(--edge2);background:#17171b;font-size:13px;font-weight:700;transition:all .12s;box-shadow:0 3px 0 #050506}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #050506}
.chip.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#1a1200;box-shadow:0 3px 0 var(--gold3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:#0b0b0d;border:1px solid var(--edge);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2)}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;box-shadow:0 2px 0 var(--gold3)}
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps i{flex:1;height:5px;border-radius:5px;background:#222}.steps i.on{background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.help{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:#ff8a8a;font-size:13px;font-weight:700;margin-top:8px}
.foot-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}

/* ---------- targets ---------- */
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:1000px}
@media(max-width:560px){.targets{grid-template-columns:repeat(2,1fr)}}
.tile{background:linear-gradient(180deg,#1e1e23,#121214);border:1px solid var(--edge2);border-radius:16px;padding:14px 12px;box-shadow:0 5px 0 #040405,0 14px 24px -12px #000;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.tile b{display:block;font-family:"Anton";font-weight:400;font-size:32px;line-height:1;color:#fff;margin:6px 0 2px}
.tile span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile small{display:block;font-size:11px;color:var(--ink2);margin-top:4px}
.tile.p::after{background:var(--p)}.tile.c::after{background:var(--c)}.tile.f::after{background:var(--f)}
.tile.p b{color:var(--p)}.tile.c b{color:var(--c)}.tile.f b{color:var(--f)}
.macrobar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:14px 0 6px;background:#000;box-shadow:0 2px 0 rgba(0,0,0,.8) inset}
.macrobar i{display:block;height:100%}.macrobar .p{background:var(--p)}.macrobar .c{background:var(--c)}.macrobar .f{background:var(--f)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* ---------- dock nav ---------- */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(18,18,21,.82);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.1);border-radius:22px;display:flex;justify-content:space-around;padding:8px 6px;z-index:30;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 40px -10px #000}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-radius:14px;transition:all .15s;flex:1}
.tabs button .i{font-size:20px;filter:grayscale(1) opacity(.7)}
.tabs button.on{color:#1a1200;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 3px 0 var(--gold3)}
.tabs button.on .i{filter:none}
.tabs button:active{transform:translateY(2px)}
@media(min-width:760px){.tabs{position:sticky;top:10px;bottom:auto;left:auto;right:auto;margin:12px 0;justify-content:flex-start;gap:4px;padding:6px}
.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:12px;padding:10px 16px}}

.daytabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{flex:0 0 auto;padding:10px 16px;border-radius:12px;background:linear-gradient(180deg,#202025,#161619);border:1px solid var(--edge2);font-weight:800;font-size:13px;box-shadow:0 4px 0 #050506;transition:transform .08s,box-shadow .08s}
.daytabs button:active{transform:translateY(3px);box-shadow:0 1px 0 #050506}
.daytabs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#1a1200;box-shadow:0 4px 0 var(--gold3)}
.daytabs button.pending{opacity:.4}

/* ---------- meal cards (tilt) ---------- */
.meals{perspective:1100px;perspective-origin:50% 0%}
.meal{--lie:0;background:linear-gradient(165deg,#1f1f24 0%,#131316 100%);border:1px solid var(--edge2);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer;position:relative;overflow:hidden;transform-style:preserve-3d;transform-origin:50% 100%;transform:rotateX(calc(var(--lie) * 22deg)) translateZ(calc(var(--lie) * -60px));transition:box-shadow .15s ease-out,border-color .15s;box-shadow:0 6px 0 #050506,0 calc(18px + var(--lie) * 30px) calc(30px + var(--lie) * 30px) -14px #000;will-change:transform}
.meal.tilting{transition:transform .15s ease-out,box-shadow .15s ease-out}
.meal::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(242,179,0,.18),transparent 45%);opacity:0;transition:opacity .2s;pointer-events:none}
.meal:hover{border-color:#4a4330;box-shadow:0 6px 0 #050506,0 30px 50px -20px rgba(242,179,0,.35)}
.meal:hover::before{opacity:1}
.meal:active{transform:translateY(4px) rotateX(0)!important;box-shadow:0 2px 0 #050506}
.meal+.meal{margin-top:12px}
.meal .slot{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);transform:translateZ(14px)}
.meal h3{font-size:22px;line-height:1.05;color:#fff;margin-top:4px;transform:translateZ(22px);font-family:"Anton";letter-spacing:.02em}
.meal p{margin:5px 0 0;font-size:13px;color:var(--ink2);transform:translateZ(10px)}
.meal .kcal{text-align:right;font-family:"Anton";font-size:30px;color:var(--gold2);line-height:1;transform:translateZ(26px)}
.meal .kcal small{display:block;font-family:"Manrope";font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.meal .macros{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin-top:8px;transform:translateZ(8px)}
.meal .macros b{font-weight:900}.m-p{color:var(--p)}.m-c{color:var(--c)}.m-f{color:var(--f)}
.meal .meta{font-size:12px;color:var(--muted)}
.meal .flag{position:absolute;top:12px;right:12px;background:#3a1414;color:#ff8a8a;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.meal.loading{opacity:.55;pointer-events:none}
.totals{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#0b0b0d;border:1px solid var(--edge);border-radius:16px;padding:12px 14px;margin:10px 0 12px;font-size:13px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.6) inset}
.totals .t{display:flex;flex-direction:column}.totals .t span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.totals .t b{font-size:16px;font-family:"Anton";font-weight:400;letter-spacing:.02em}.totals .t b.good{color:var(--gold2)}.totals .t b.off{color:#ff8a8a}
.chefnote{background:linear-gradient(90deg,#1d1808,#121214);border:1px solid #3a2e0a;border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;margin:0 0 12px;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:#000;border:1px solid var(--gold3);display:grid;place-items:center;overflow:hidden;flex:0 0 36px}
.av img{width:34px;height:34px;object-fit:cover;object-position:center top}
.av.big{width:92px;height:92px;flex-basis:92px;border-width:2px;box-shadow:0 0 0 6px rgba(242,179,0,.12),0 20px 40px -10px #000}
.av.big img{width:88px;height:88px}

/* ---------- progress ---------- */
.progress{background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--edge2);border-radius:var(--r);padding:26px 22px;text-align:center;box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center}
.progress .av.big{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.progress h3{font-size:26px;margin:14px 0 4px;color:#fff}
.progress p{color:var(--ink2);margin:0 0 14px;font-size:14px}
.bar{height:12px;width:100%;background:#000;border-radius:99px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.8) inset;border:1px solid var(--edge)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(242,179,0,.5)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s}
@media(min-width:620px){.modal-bg{align-items:center;padding:20px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,#17171b,#0e0e10);border:1px solid var(--edge2);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px 30px;animation:up .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px #000}
@media(min-width:620px){.modal{border-radius:26px;padding:26px}}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.modal .close{position:sticky;top:0;float:right;background:var(--panel2);border:1px solid var(--edge2);border-radius:50%;width:36px;height:36px;font-size:16px;display:grid;place-items:center;box-shadow:0 3px 0 #000}
.modal h2{font-size:34px;line-height:1;margin:6px 0 4px;color:#fff}
.ing{list-style:none;padding:0;margin:8px 0 0}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--edge2);font-size:14px}
.ing li span:last-child{color:var(--gold2);white-space:nowrap;font-weight:700}
.steps-list{padding-left:0;list-style:none;counter-reset:s;margin:8px 0 0}
.steps-list li{counter-increment:s;display:flex;gap:12px;padding:9px 0;font-size:14px;color:var(--ink)}
.steps-list li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:9px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;display:grid;place-items:center;font-weight:900;font-size:12px;box-shadow:0 3px 0 var(--gold3)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:#1d1d22;border:1px solid var(--edge2);color:var(--ink2)}
.macro-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.macro-tiles div{background:#0b0b0d;border:1px solid var(--edge2);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 #000}
.macro-tiles b{display:block;font-size:18px;font-family:"Anton";font-weight:400;color:#fff}.macro-tiles span{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- grocery ---------- */
.gcat{margin-top:16px}
.gcat h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-family:"Manrope";font-weight:800;margin-bottom:6px}
.gitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--edge2);font-size:14px}
.gitem input{appearance:none;width:22px;height:22px;border-radius:7px;border:1px solid var(--edge2);background:#0b0b0d;box-shadow:0 2px 0 #000;display:grid;place-items:center;cursor:pointer;flex:0 0 22px}
.gitem input:checked{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold)}
.gitem input:checked::after{content:"✓";color:#1a1200;font-weight:900;font-size:13px}
.gitem.done label{text-decoration:line-through;color:var(--muted)}
.gitem label{flex:1;cursor:pointer}.gitem span{color:var(--muted);font-size:12px;white-space:nowrap}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:85%;padding:12px 15px;border-radius:18px;font-size:14px;white-space:pre-wrap;line-height:1.45}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;border-bottom-right-radius:5px;font-weight:600;box-shadow:0 3px 0 var(--gold3)}
.msg.mpm{align-self:flex-start;background:#1c1c21;border:1px solid var(--edge2);border-bottom-left-radius:5px;box-shadow:0 3px 0 #000}
.chatbox{display:flex;gap:8px;margin-top:12px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ---------- plans ---------- */
.planrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px dashed var(--edge2)}
.planrow b{display:block;font-size:15px;color:#fff}.planrow span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:800;z-index:80;box-shadow:0 4px 0 var(--gold3),0 20px 40px -10px #000;animation:fade .2s;max-width:90vw;text-align:center}
@media(min-width:760px){.toast{bottom:24px}}
.banner{background:#1b1608;border:1px solid #3a2e0a;border-radius:16px;padding:12px 14px;font-size:13px;margin:10px 0;color:var(--ink)}
.disclaimer{font-size:11px;color:var(--muted);text-align:center;margin:30px 0 8px;line-height:1.5}
.empty{text-align:center;padding:44px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:24px;color:#fff}

@media(max-width:420px){.brand small{display:none}.brand h1{font-size:20px}}

/* ---------- intake: page turn ---------- */
.turn-wrap{perspective:1400px}
.turn{transform-origin:0% 50%;animation:turn .5s cubic-bezier(.2,.8,.2,1) both;backface-visibility:hidden}
@keyframes turn{from{opacity:0;transform:rotateY(-14deg) translateX(18px)}to{opacity:1;transform:none}}
/* ---------- recipe sheet rises in perspective ---------- */
.modal-bg{perspective:1200px}
.modal{transform-origin:50% 100%;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{opacity:0;transform:translateY(40px) rotateX(10deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.turn,.modal{animation:none}}

.weeknav{display:inline-flex;align-items:center;gap:8px;background:#0b0b0d;border:1px solid var(--edge);border-radius:12px;padding:4px 6px}
.weeknav span{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:110px}
.weeknav b{font-family:"Anton";font-weight:400;letter-spacing:.04em;font-size:15px;color:var(--gold2)}
.weeknav small{font-size:10px;color:var(--muted);font-weight:700}
.client-login{border-color:#3a2e0a;background:linear-gradient(170deg,#1b1608,#121214)}

.login-row{align-items:stretch}@media(max-width:520px){.login-row{flex-direction:column}.login-row .btn{width:100%}}

</style>
</head>

ast with salt, pepper, half the oregano and the garlic; grill or pan-sear in a nonstick skillet over medium-high 6-7 minutes per side until 165°F, then rest 5 minutes and slice.","Cook quinoa according to package directions (or use leftover) and let cool slightly.","Whisk olive oil, lemon juice, remaining oregano, salt and pepper into a dressing.","Toss greens, quinoa, chickpeas, cucumber and tomato with the dressing; top with sliced chicken and feta."],"macros":{"kcal":779,"protein":72,"carbs":55,"fat":29,"fiber":11},"tags":["high-protein","mediterranean","30-min"],"mealPrepTip":"Grill 3-4 chicken breasts at once for lunches later in the week."},{"id":"c3","slot":"Snack","name":"Cottage Cheese with Strawberries & Almonds","description":"Cool, creamy cottage cheese topped with sliced strawberries and crunchy almonds.","prepMin":3,"cookMin":0,"servings":1,"ingredients":[{"item":"cottage cheese 2%","qty":"3/4 cup","grams":200,"category":"Dairy & Eggs"},{"item":"strawberries","qty":"1 cup sliced","grams":150,"category":"Produce"},{"item":"almonds","qty":"2 tbsp","grams":15,"category":"Pantry"}],"instructions":["Spoon cottage cheese into a bowl.","Hull and slice the strawberries and scatter on top.","Finish with the almonds and a pinch of cinnamon if you like."],"macros":{"kcal":303,"protein":26,"carbs":23,"fat":13,"fiber":5},"tags":["high-protein","no-cook","5-min"],"mealPrepTip":""},{"id":"c4","slot":"Dinner","name":"Turmeric-Baked Salmon with Sweet Potato, Lentils & Broccoli","description":"Flaky salmon rubbed with turmeric, black pepper and ginger, roasted alongside sweet potato and garlicky broccoli over warm lentils.","prepMin":15,"cookMin":25,"servings":1,"ingredients":[{"item":"salmon fillet","qty":"7 oz cooked (8.5 oz raw)","grams":200,"category":"Protein"},{"item":"sweet potato","qty":"1 medium, cubed","grams":200,"category":"Produce"},{"item":"lentils (cooked)","qty":"1/2 cup","grams":100,"category":"Pantry"},{"item":"broccoli florets","qty":"2 cups","grams":150,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"2 tsp","grams":10,"category":"Pantry"},{"item":"ground turmeric","qty":"1 tsp","grams":2,"category":"Spices & Condiments"},{"item":"fresh ginger","qty":"1 tsp grated","grams":3,"category":"Produce"},{"item":"black pepper","qty":"1/2 tsp","grams":1,"category":"Spices & Condiments"},{"item":"garlic","qty":"2 cloves, sliced","grams":6,"category":"Produce"},{"item":"lemon","qty":"1/2, for serving","grams":20,"category":"Produce"}],"instructions":["Heat oven to 425°F. Toss sweet potato cubes with half the olive oil and salt on a sheet pan; roast 15 minutes.","Rub salmon with turmeric, black pepper, grated ginger and salt. Push potatoes to one side, add salmon and broccoli (tossed with remaining oil and sliced garlic) to the pan.","Roast 12-14 minutes more until salmon flakes easily and broccoli is charred at the edges.","Warm the lentils with a pinch of salt and a squeeze of lemon; plate lentils, top with salmon, sweet potato and broccoli, and finish with more lemon."],"macros":{"kcal":849,"protein":61,"carbs":73,"fat":35,"fiber":19},"tags":["omega-3","sheet-pan","anti-inflammatory"],"mealPrepTip":"Cook a big pot of lentils tonight; they appear again later in the week."}],"chefNote":"Start the week strong: every meal today leans on olive oil, omega-3s and greens, so eat slowly, hydrate (3.9 L target) and notice how steady your energy feels without sugar.","flags":[],"violations":0},{"day":2,"theme":"Mexican Tuesday","meals":[{"id":"c5","slot":"Breakfast","name":"Turkey & Black Bean Breakfast Scramble with Corn Tortillas","description":"Cumin-spiced ground turkey, fluffy egg whites, black beans and peppers scrambled together and served with warm corn tortillas, avocado and fresh salsa.","prepMin":10,"cookMin":12,"servings":1,"ingredients":[{"item":"ground turkey 93% lean","qty":"4 oz cooked (5.5 oz raw)","grams":120,"category":"Protein"},{"item":"egg whites","qty":"2/3 cup","grams":150,"category":"Dairy & Eggs"},{"item":"black beans (canned, rinsed)","qty":"1/2 cup","grams":80,"category":"Pantry"},{"item":"corn tortillas","qty":"2 small","grams":52,"category":"Grains & Bread"},{"item":"bell pepper","qty":"1/2, diced","grams":60,"category":"Produce"},{"item":"onion","qty":"1/4 small, diced","grams":30,"category":"Produce"},{"item":"avocado","qty":"1/3 medium","grams":50,"category":"Produce"},{"item":"tomato","qty":"1/2 medium, diced","grams":50,"category":"Produce"},{"item":"ground cumin","qty":"1/2 tsp","grams":1,"category":"Spices & Condiments"},{"item":"chili powder","qty":"1/2 tsp","grams":1,"category":"Spices & Condiments"},{"item":"lime","qty":"1/2, juiced","grams":15,"category":"Produce"}],"instructions":["Brown the ground turkey in a nonstick skillet over medium-high heat with cumin, chili powder and salt, breaking it up, 5-6 minutes.","Add onion and bell pepper; cook 3 minutes until softened, then stir in black beans.","Pour in the egg whites, reduce heat to medium-low and gently fold until just set, about 2 minutes.","Warm tortillas in a dry pan 30 seconds per side. Serve the scramble with tortillas, sliced avocado and a quick salsa of diced tomato, lime juice and salt."],"macros":{"kcal":628,"protein":61,"carbs":56,"fat":18,"fiber":16},"tags":["high-protein","mexican","30-min"],"mealPrepTip":""},{"id":"c6","slot":"Lunch","name":"Chipotle Shrimp Burrito Bowl","description":"Smoky chipotle shrimp over cilantro-lime brown rice with black beans, charred peppers, tomato, avocado and a Greek-yogurt crema.","prepMin":10,"cookMin":15,"servings":1,"ingredients":[{"item":"shrimp (peeled, deveined)","qty":"7 oz cooked","grams":200,"category":"Protein"},{"item":"brown rice","qty":"3/4 cup cooked","grams":150,"category":"Grains & Bread"},{"item":"black beans (canned, rinsed)","qty":"2/3 cup","grams":100,"category":"Pantry"},{"item":"avocado","qty":"1/2 small","grams":60,"category":"Produce"},{"item":"bell pepper","qty":"1 small, sliced","grams":80,"category":"Produce"},{"item":"tomato","qty":"1 small, diced","grams":80,"category":"Produce"},{"item":"greek yogurt nonfat plain","qty":"3 tbsp","grams":50,"category":"Dairy & Eggs"},{"item":"extra-virgin olive oil","qty":"2 tsp","grams":10,"category":"Pantry"},{"item":"chipotle chili powder","qty":"1 tsp","grams":2,"category":"Spices & Condiments"},{"item":"lime","qty":"1, juiced","grams":30,"category":"Produce"},{"item":"fresh cilantro","qty":"2 tbsp chopped","grams":5,"category":"Produce"}],"instructions":["Toss shrimp with chipotle chili powder, half the olive oil and salt.","Heat a skillet over high; sear bell pepper strips in remaining oil 3-4 minutes until charred, remove. Sear shrimp 1-2 minutes per side until pink and opaque.","Stir half the lime juice and the cilantro into the warm brown rice; warm the black beans.","Mix Greek yogurt with remaining lime juice and a pinch of salt for crema. Build the bowl: rice, beans, shrimp, peppers, tomato, avocado and crema."],"macros":{"kcal":768,"protein":69,"carbs":78,"fat":22,"fiber":18},"tags":["high-protein","mexican","30-min"],"mealPrepTip":"Cook 3 cups of brown rice today for bowls later in the week."},{"id":"c7","slot":"Snack","name":"Banana Whey Shake","description":"A quick blender shake of whey, banana and almond milk with a dash of cinnamon.","prepMin":3,"cookMin":0,"servings":1,"ingredients":[{"item":"whey protein powder","qty":"1 scoop","grams":30,"category":"Pantry"},{"item":"banana","qty":"1 medium","grams":120,"category":"Produce"},{"item":"unsweetened almond milk","qty":"1 cup","grams":250,"category":"Beverages"}],"instructions":["Add almond milk, banana and whey to a blender.","Blend 30 seconds until smooth, adding a few ice cubes if you like it cold.","Pour and drink within 15 minutes."],"macros":{"kcal":264,"protein":27,"carbs":31,"fat":5,"fiber":4},"tags":["high-protein","5-min","shake"],"mealPrepTip":""},{"id":"c8","slot":"Dinner","name":"Chicken Fajita Skillet with Black Beans","description":"Sizzling strips of chicken breast with peppers and onions in a smoky fajita rub, served with warm corn tortillas, black beans and avocado.","prepMin":15,"cookMin":15,"servings":1,"ingredients":[{"item":"chicken breast","qty":"7 oz cooked (9 oz raw)","grams":200,"category":"Protein"},{"item":"bell pepper","qty":"1 1/2 large, sliced","grams":150,"category":"Produce"},{"item":"onion","qty":"1/2 large, sliced","grams":80,"category":"Produce"},{"item":"corn tortillas","qty":"3 small","grams":78,"category":"Grains & Bread"},{"item":"black beans (canned, rinsed)","qty":"1/3 cup","grams":60,"category":"Pantry"},{"item":"avocado","qty":"1/2 small","grams":60,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"2 1/2 tsp","grams":12,"category":"Pantry"},{"item":"ground cumin","qty":"1 tsp","grams":2,"category":"Spices & Condiments"},{"item":"smoked paprika","qty":"1 tsp","grams":2,"category":"Spices & Condiments"},{"item":"garlic","qty":"2 cloves, minced","grams":6,"category":"Produce"},{"item":"lime","qty":"1, cut in wedges","grams":30,"category":"Produce"}],"instructions":["Slice chicken into strips and toss with cumin, smoked paprika, garlic, salt and 1 tsp of the olive oil.","Heat a large cast-iron or nonstick skillet over high heat with the remaining oil; cook peppers and onions 5-6 minutes until blistered, then remove.","Add chicken in a single layer and sear 3-4 minutes per side until cooked through; return vegetables to the pan and toss.","Warm tortillas and black beans. Serve the fajita mix with tortillas, beans, sliced avocado and lime wedges."],"macros":{"kcal":860,"protein":75,"carbs":71,"fat":31,"fiber":19},"tags":["high-protein","mexican","30-min"],"mealPrepTip":""}],"chefNote":"Mexican flavors without the fryer: build heat with chili, cumin and lime instead of cheese and chips, and keep portions of tortillas measured.","flags":[],"violations":0},{"day":3,"theme":"Mediterranean Wednesday","meals":[{"id":"c9","slot":"Breakfast","name":"Spinach & Feta Egg Scramble with Whole Whe  yogurt, spinach, ginger, turmeric and cinnamon to a blender and blend until the greens are fully broken down.","Add banana, frozen blueberries, oats and flaxseed; blend 30 seconds.","Add the whey last and pulse just until smooth (over-blending whey makes it foamy).","Pour into a tall glass; add ice or a splash of water to reach your preferred thickness."],"macros":{"kcal":634,"protein":58,"carbs":69,"fat":14,"fiber":14},"tags":["high-protein","5-min","no-cook"],"mealPrepTip":"Freeze banana, blueberries, spinach and oats together in zip bags for dump-and-blend mornings."},{"id":"c3i","slot":"Lunch","name":"Ginger-Garlic Turkey Lettuce Wraps with Mushrooms & Brown Rice","description":"Savory ground turkey cooked with mushrooms, peppers, carrot, ginger and garlic, piled into crisp lettuce cups with a side of brown rice.","prepMin":10,"cookMin":15,"servings":1,"ingredients":[{"item":"ground turkey 93% lean","qty":"7 oz cooked","grams":200,"category":"Protein"},{"item":"brown rice (cooked)","qty":"3/4 cup","grams":160,"category":"Grains & Bread"},{"item":"butter lettuce or romaine leaves","qty":"8 large leaves","grams":100,"category":"Produce"},{"item":"carrot","qty":"1 small, finely diced","grams":60,"category":"Produce"},{"item":"mushrooms","qty":"1 cup diced","grams":80,"category":"Produce"},{"item":"red bell pepper","qty":"1/2 large, diced","grams":80,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1 1/2 tsp","grams":7,"category":"Pantry"},{"item":"toasted sesame oil","qty":"1 tsp","grams":5,"category":"Pantry"},{"item":"coconut aminos","qty":"4 tsp","grams":20,"category":"Spices & Condiments"},{"item":"fresh ginger, grated","qty":"1 tbsp","grams":8,"category":"Produce"},{"item":"garlic, minced","qty":"2 cloves","grams":6,"category":"Produce"},{"item":"lime juice","qty":"1 tbsp","grams":15,"category":"Produce"}],"instructions":["Heat olive oil in a large skillet over medium-high heat. Add the turkey and brown 5-6 minutes, breaking it up, until no longer pink.","Add mushrooms, carrot, bell pepper, ginger and garlic; cook 4 minutes until the vegetables soften.","Stir in coconut aminos, sesame oil and lime juice; cook 1 minute, then season with salt and black pepper.","Spoon the filling into lettuce leaves and serve with brown rice on the side (or tuck a spoonful of rice into each wrap)."],"macros":{"kcal":785,"protein":64,"carbs":67,"fat":29,"fiber":9},"tags":["high-protein","30-min","asian-inspired"],"mealPrepTip":"The turkey filling keeps 4 days; reheat and wrap fresh lettuce at lunchtime."},{"id":"c3j","slot":"Snack","name":"Cottage Cheese with Strawberries & Chia","description":"Creamy cottage cheese topped with sliced strawberries and a spoon of chia seeds.","prepMin":3,"cookMin":0,"servings":1,"ingredients":[{"item":"cottage cheese 2%","qty":"scant 1 cup","grams":200,"category":"Dairy & Eggs"},{"item":"strawberries","qty":"3/4 cup sliced","grams":120,"category":"Produce"},{"item":"chia seeds","qty":"1 heaping tbsp","grams":15,"category":"Pantry"}],"instructions":["Spoon cottage cheese into a bowl.","Top with sliced strawberries.","Sprinkle chia seeds over the top and let sit 2 minutes so they soften slightly."],"macros":{"kcal":286,"protein":25,"carbs":24,"fat":10,"fiber":8},"tags":["quick","high-protein"],"mealPrepTip":""},{"id":"c3k","slot":"Dinner","name":"Pan-Seared Cod with Ginger-Scallion Bok Choy, Edamame & Roasted Sweet Potato","description":"Flaky cod seared in olive oil and finished with a sizzling ginger-scallion sesame oil, alongside garlicky bok choy, edamame and caramelized sweet potato wedges.","prepMin":10,"cookMin":30,"servings":1,"ingredients":[{"item":"cod fillet","qty":"9 oz cooked","grams":250,"category":"Protein"},{"item":"sweet potato","qty":"1 large, cut into wedges","grams":250,"category":"Produce"},{"item":"baby bok choy","qty":"3 heads, halved","grams":200,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1 tbsp","grams":14,"category":"Pantry"},{"item":"toasted sesame oi ":"Produce"},{"item":"edamame, shelled (frozen)","qty":"2/3 cup","grams":100,"category":"Frozen"},{"item":"tomato","qty":"1 medium, diced","grams":100,"category":"Produce"},{"item":"avocado","qty":"1/4 medium","grams":50,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1 1/2 tsp","grams":7,"category":"Pantry"},{"item":"lime juice","qty":"1 tbsp","grams":15,"category":"Produce"},{"item":"fresh ginger, grated","qty":"2 tsp","grams":6,"category":"Produce"},{"item":"garlic, minced","qty":"1 clove","grams":4,"category":"Produce"}],"instructions":["Whisk olive oil, lime juice, ginger, garlic, salt and pepper into a dressing.","Massage the kale with half the dressing for 1 minute until it softens and darkens.","Thaw edamame in hot water 3 minutes and drain.","Layer brown rice, kale, edamame, tomato and avocado in a bowl; top with the sardines, broken into chunks, and drizzle with the rest of the dressing."],"macros":{"kcal":820,"protein":52,"carbs":72,"fat":36,"fiber":15},"tags":["omega-3","no-cook","anti-inflammatory"],"mealPrepTip":"Keep 3-4 cans of sardines in the pantry; this bowl assembles in under 10 minutes."},{"id":"c3n","slot":"Snack","name":"Banana Almond Butter Whey Shake","description":"A cold shake of vanilla whey, banana and almond butter blended with ice water.","prepMin":3,"cookMin":0,"servings":1,"ingredients":[{"item":"whey protein powder (vanilla)","qty":"1 heaping scoop","grams":35,"category":"Pantry"},{"item":"banana","qty":"1 medium","grams":120,"category":"Produce"},{"item":"almond butter","qty":"2 tsp","grams":10,"category":"Pantry"}],"instructions":["Add 1 cup cold water and a handful of ice to a blender.","Add banana, almond butter and whey.","Blend 30 seconds until smooth and drink immediately."],"macros":{"kcal":324,"protein":31,"carbs":32,"fat":8,"fiber":4},"tags":["quick","post-workout"],"mealPrepTip":""},{"id":"c3o","slot":"Dinner","name":"Grilled Turmeric-Ginger Chicken Skewers with Coconut Brown Rice & Charred Broccoli","description":"Chicken breast marinated in turmeric, ginger, garlic and lime, grilled on skewers with sweet peppers, served over coconut-scented brown rice with charred broccoli and cilantro.","prepMin":15,"cookMin":20,"servings":1,"ingredients":[{"item":"chicken breast, boneless skinless","qty":"8 oz cooked","grams":230,"category":"Protein"},{"item":"brown rice (cooked)","qty":"scant 1 cup","grams":170,"category":"Grains & Bread"},{"item":"broccoli florets","qty":"1 2/3 cups","grams":150,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1 tbsp","grams":14,"category":"Pantry"},{"item":"light coconut milk (canned)","qty":"1/4 cup","grams":60,"category":"Pantry"},{"item":"red bell pepper","qty":"1 medium, cut in chunks","grams":100,"category":"Produce"},{"item":"lime juice","qty":"1 tbsp","grams":15,"category":"Produce"},{"item":"cilantro, chopped","qty":"2 tbsp","grams":10,"category":"Produce"},{"item":"fresh ginger, grated","qty":"1 tbsp","grams":8,"category":"Produce"},{"item":"garlic, minced","qty":"2 cloves","grams":6,"category":"Produce"},{"item":"turmeric, cumin, paprika and black pepper","qty":"1/2 tsp each plus 1 tsp turmeric","grams":5,"category":"Spices & Condiments"}],"instructions":["Cut chicken into 1 1/2-inch cubes and toss with 2 tsp of the olive oil, turmeric, cumin, paprika, black pepper, ginger, garlic, lime juice and salt; marinate 10 minutes (or overnight).","Thread chicken and bell pepper chunks onto skewers. Toss broccoli with the remaining olive oil, salt and pepper.","Grill (or broil) skewers 10-12 minutes, turning, until charred and cooked through to 165 F; grill broccoli alongside 6-8 minutes until edges blacken.","Warm the brown rice with the coconut milk and a pinch of salt 2 minutes. Plate rice, skewers and broccoli; top with cilantro and extra lime."],"macros":{"kcal":878,"protein":82,"carbs":70,"fat":30,"fiber":12},"tags":["grilled","high-protein","anti-inflammatory"],"mealPrepTip":"Marinate a second batch of chicken tonight for qu 10,"category":"Pantry"},{"item":"garlic","qty":"3 cloves","grams":9,"category":"Produce"},{"item":"red pepper flakes","qty":"1/4 tsp","grams":1,"category":"Spices & Condiments"},{"item":"lemon","qty":"1/2","grams":30,"category":"Produce"}],"instructions":["Cook the rigatoni per package; reserve 1/4 cup pasta water and drain.","Heat olive oil in a large skillet over medium-high; brown the turkey with salt, pepper and red pepper flakes 7-8 minutes.","Add garlic and cherry tomatoes; cook 3 minutes until tomatoes burst.","Add kale and a splash of pasta water; stir until wilted, 2 minutes.","Toss with the pasta, lemon juice and parmesan; adjust seasoning and serve."],"macros":{"kcal":784,"protein":67,"carbs":66,"fat":28,"fiber":13},"tags":["italian-american","30-min","high-protein"],"mealPrepTip":"Makes a great cold lunch the next day too."},{"id":"c63","slot":"Snack","name":"Tuna Avocado Toast","description":"Quick open-faced toast with lemony tuna and creamy avocado.","prepMin":4,"cookMin":1,"servings":1,"ingredients":[{"item":"tuna canned in water (drained)","qty":"1 small can","grams":100,"category":"Protein"},{"item":"whole wheat bread","qty":"1.5 slices","grams":48,"category":"Grains & Bread"},{"item":"avocado","qty":"1/3 small","grams":45,"category":"Produce"}],"instructions":["Toast the bread.","Mash avocado onto the toast with a pinch of salt and pepper.","Top with the drained tuna and a squeeze of lemon if available."],"macros":{"kcal":309,"protein":33,"carbs":24,"fat":9,"fiber":6},"tags":["5-min","high-protein"],"mealPrepTip":"Keep single-serve tuna pouches in the pantry."},{"id":"c64","slot":"Dinner","name":"Garlic-Ginger Shrimp Stir-Fry with Broccoli & Brown Rice","description":"Plump shrimp stir-fried with broccoli, peppers and carrot in a ginger-garlic sauce, over brown rice with toasted almonds.","prepMin":12,"cookMin":12,"servings":1,"ingredients":[{"item":"shrimp (peeled, deveined)","qty":"10 oz raw (8.5 oz cooked)","grams":240,"category":"Protein"},{"item":"brown rice (cooked)","qty":"1 cup heaping","grams":200,"category":"Grains & Bread"},{"item":"broccoli florets","qty":"2 cups","grams":150,"category":"Produce"},{"item":"red bell pepper","qty":"1 medium","grams":80,"category":"Produce"},{"item":"carrot","qty":"1 small, sliced","grams":50,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1 tbsp + 1 tsp","grams":16,"category":"Pantry"},{"item":"almonds","qty":"3 tbsp sliced","grams":20,"category":"Pantry"},{"item":"fresh ginger (grated)","qty":"1 tbsp","grams":10,"category":"Produce"},{"item":"garlic","qty":"3 cloves","grams":9,"category":"Produce"},{"item":"coconut aminos","qty":"1 tbsp","grams":15,"category":"Spices & Condiments"},{"item":"green onion","qty":"2 stalks","grams":15,"category":"Produce"}],"instructions":["Toast the almonds in a dry wok or large skillet 2 minutes; set aside.","Heat half the oil over high; stir-fry broccoli, carrot and pepper 4 minutes until crisp-tender; remove.","Add remaining oil, ginger and garlic; stir 30 seconds, then add shrimp and cook 2 minutes per side.","Return the vegetables, add coconut aminos and a splash of water; toss 1 minute.","Serve over brown rice topped with green onion and toasted almonds."],"macros":{"kcal":866,"protein":72,"carbs":77,"fat":30,"fiber":14},"tags":["asian-american","25-min","anti-inflammatory"],"mealPrepTip":"Chop all vegetables before the wok gets hot — stir-fry moves fast."}],"chefNote":"Ginger and garlic are doing anti-inflammatory work tonight — grate the ginger fresh, and if you have a long workout today, move the tuna toast to right after training.","flags":[],"violations":0},{"day":7,"theme":"Finale Sunday — Graduation Plate & Prep for What's Next","meals":[{"id":"c65","slot":"Breakfast","name":"Sweet Potato Turkey Hash with Baked Eggs","description":"Crispy sweet potato and pepper hash with seasoned ground turkey, spinach and eggs baked right into the skillet.","prepMin":10,"cookMin":20,"servings":1,"ingredients":[{"item":"ground turkey 93% lean","qty":"4 oz raw (3.5 oz cooked)","grams":100,"category":"Protein"},{"item":"sweet potato","qty":"1 medium, diced","grams":200,"category":"Produce"},{"item":"whole eggs","qty":"2 large","grams":100,"category":"Dairy & Eggs"},{"item":"egg whites","qty":"1/3 cup","grams":80,"category":"Dairy & Eggs"},{"item":"red bell pepper","qty":"3/4 medium","grams":60,"category":"Produce"},{"item":"onion","qty":"1/4 medium","grams":40,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1/2 tbsp","grams":8,"category":"Pantry"},{"item":"baby spinach","qty":"1.5 cups","grams":40,"category":"Produce"},{"item":"smoked paprika","qty":"1/2 tsp","grams":1,"category":"Spices & Condiments"},{"item":"ground turmeric","qty":"1/4 tsp","grams":1,"category":"Spices & Condiments"}],"instructions":["Microwave the diced sweet potato 4 minutes to soften. Heat olive oil in an oven-safe skillet over medium-high; add sweet potato, pepper and onion and cook 6 minutes until browned.","Add turkey, paprika, turmeric, salt and pepper; cook 5 minutes, breaking it up, then stir in spinach until wilted.","Make 3 wells; crack in the whole eggs and pour the egg whites into the third well.","Cover and cook on low 4-5 minutes (or bake at 400°F for 6 minutes) until whites are set and yolks still soft."],"macros":{"kcal":653,"protein":55,"carbs":52,"fat":25,"fiber":9},"tags":["one-pan","weekend","high-protein"],"mealPrepTip":"Use the extra roasted sweet potato from Monday to cut cook time in half."},{"id":"c66","slot":"Lunch","name":"Grilled Chicken & Hummus Mediterranean Plate","description":"Sliced grilled chicken breast with a generous scoop of hummus, cucumber, peppers, tomato, greens and warm whole wheat bread for dipping.","prepMin":10,"cookMin":12,"servings":1,"ingredients":[{"item":"chicken breast","qty":"7.5 oz raw (6 oz cooked)","grams":170,"category":"Protein"},{"item":"hummus","qty":"1/3 cup","grams":80,"category":"Pantry"},{"item":"whole wheat bread","qty":"2.5 slices","grams":80,"category":"Grains & Bread"},{"item":"cucumber","qty":"1 cup sliced","grams":100,"category":"Produce"},{"item":"bell pepper","qty":"1 medium, sliced","grams":80,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1/2 tbsp","grams":8,"category":"Pantry"},{"item":"tomato","qty":"3/4 cup diced","grams":80,"category":"Produce"},{"item":"mixed greens","qty":"1.5 cups","grams":40,"category":"Produce"},{"item":"lemon","qty":"1/2","grams":30,"category":"Produce"},{"item":"dried oregano","qty":"1/2 tsp","grams":1,"category":"Spices & Condiments"},{"item":"garlic","qty":"1 clove","grams":3,"category":"Produce"}],"instructions":["Pound chicken to even thickness; season with oregano, minced garlic, salt and pepper and grill or pan-sear 5-6 minutes per side until 165°F; rest and slice.","Toast or grill the bread briefly.","Arrange greens, cucumber, pepper and tomato on a plate; drizzle with olive oil, lemon juice and a pinch of salt.","Add the hummus and sliced chicken and serve with the bread."],"macros":{"kcal":741,"protein":71,"carbs":58,"fat":25,"fiber":14},"tags":["mediterranean","20-min","no-fuss"],"mealPrepTip":"Use the extra breasts you grilled on Wednesday and this is assembly only."},{"id":"c67","slot":"Snack","name":"Edamame, Orange & Almonds","description":"Steamed salted edamame with a juicy orange and a small handful of almonds.","prepMin":3,"cookMin":3,"servings":1,"ingredients":[{"item":"edamame (shelled, frozen)","qty":"1 cup","grams":140,"category":"Frozen"},{"item":"orange","qty":"1 medium","grams":130,"category":"Produce"},{"item":"almonds","qty":"10 almonds","grams":10,"category":"Pantry"}],"instructions":["Microwave or steam the edamame 3 minutes and sprinkle with sea salt.","Peel and segment the orange.","Serve with the almonds."],"macros":{"kcal":308,"protein":20,"carbs":30,"fat":12,"fiber":11},"tags":["5-min","plant-protein","high-fiber"],"mealPrepTip":"Keep a bag of shelled edamame in the freezer as your emergency snack."},{"id":"c68","slot":"Dinner","name":"Pan-Seared Salmon over Warm Lentils with Garlicky Kale","description":"Crisp-skinned salmon on a bed of lemony lentils with sautéed kale, tomato and onion — the week's closing omega-3 plate.","prepMin":10,"cookMin":20,"servings":1,"ingredients":[{"item":"salmon fillet (skin-on)","qty":"9 oz raw (7 oz cooked)","grams":200,"category":"Protein"},{"item":"lentils (cooked)","qty":"scant 1 cup","grams":180,"category":"Pantry"},{"item":"kale","qty":"3 cups chopped","grams":80,"category":"Produce"},{"item":"tomato","qty":"3/4 cup diced","grams":80,"category":"Produce"},{"item":"extra-virgin olive oil","qty":"1.25 tsp","grams":6,"category":"Pantry"},{"item":"onion","qty":"1/4 medium","grams":40,"category":"Produce"},{"item":"whole wheat bread","qty":"1 slice","grams":32,"category":"Grains & Bread"},{"item":"garlic","qty":"2 cloves","grams":6,"category":"Produce"},{"item":"lemon","qty":"1/2","grams":30,"category":"Produce"},{"item":"fresh ginger (grated)","qty":"1 tsp","grams":5,"category":"Produce"},{"item":"black pepper","qty":"1/4 tsp","grams":1,"category":"Spices & Condiments"}],"instructions":["Pat salmon dry, season with salt, pepper and grated ginger. Heat a nonstick skillet over medium-high; cook skin-side down 5 minutes without moving, flip and cook 3 minutes more; remove.","In the same pan add the olive oil, onion and garlic; cook 2 minutes, then add kale and tomato and sauté 3 minutes until wilted.","Stir in the lentils and lemon juice; warm through and season.","Plate the lentils and kale, set the salmon on top and serve with the slice of toasted bread."],"macros":{"kcal":829,"protein":69,"carbs":64,"fat":33,"fiber":21},"tags":["omega-3","30-min","anti-inflammatory"],"mealPrepTip":"MEAL-PREP FOR NEXT WEEK: tonight, batch-cook 4 cups lentils, 4 cups quinoa and 4 cups brown rice; roast 2 lbs sweet potatoes; grill 4 chicken breasts; make 3 jars of overnight oats; and portion Greek yogurt and berries into single-serve containers. That covers 5 breakfasts, 4 lunches and 3 dinners for the maintenance week ahead."}],"chefNote":"You finished all 8 weeks — spend 90 minutes tonight on the prep list in the dinner tip so the habits that built this result carry straight into next week without a gap.","flags":[],"violations":0}]}]}};

<script>
/* Meal Plan Man — depth applied to real elements, all CSS 3D, no WebGL.
   1. Hero: the logo is the object. It tilts toward the cursor on a critically
      damped spring, a key-light sweep crosses it (masked to the logo), and a
      floor reflection sits under it.
   2. Meal cards: a deck in perspective. Each card lies back and stands up as it
      travels toward the viewport's focus line — one seek(progress) per card.
   3. Intake steps: the card turns like a page on each step. (CSS keyframes.) */
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hover = !window.matchMedia("(hover: none)").matches;

  /* ---------- 1. hero object spring ---------- */
  let heroObj = null, tx = 0, ty = 0, rx = 0, ry = 0, vx = 0, vy = 0, raf = null, last = 0;
  function spring(x, v, target, dt) { // critically damped, k=60
    const k = 60, c = 2 * Math.sqrt(k);
    const a = -k * (x - target) - c * v; v += a * dt; x += v * dt; return [x, v];
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
    [rx, vx] = spring(rx, vx, tx, dt); [ry, vy] = spring(ry, vy, ty, dt);
    if (heroObj && heroObj.isConnected) heroObj.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    else { cancelAnimationFrame(raf); raf = null; }
  }
  if (hover && !reduce) {
    window.addEventListener("pointermove", e => {
      if (!heroObj || !heroObj.isConnected) return;
      const r = heroObj.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      ty = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width))) * 9;
      tx = -Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height))) * 6;
    }, { passive: true });
  }
  function mountHero() {
    heroObj = document.getElementById("heroObj"); if (!heroObj) return;
    tx = ty = 0; rx = reduce ? 0 : -4; ry = reduce ? 0 : 6; vx = vy = 0; // enters from a slight angle, settles square
    if (!raf && !reduce) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }

  /* ---------- 2. meal deck: stand up on scroll ---------- */
  let deckCards = [], ticking = false;
  function seekDeck() {
    ticking = false;
    const vh = window.innerHeight, focus = vh * 0.62; // cards are upright once they pass this line
    for (const el of deckCards) {
      if (!el.isConnected) continue;
      const r = el.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, 1 - (r.top - (focus - r.height)) / (vh * 0.45))); // 0 = below fold, 1 = at/after focus
      const e = 1 - Math.pow(1 - p, 3);
      el.style.setProperty("--lie", (1 - e).toFixed(3));
      el.style.opacity = (0.35 + 0.65 * e).toFixed(3);
    }
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(seekDeck); } }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  function mountDeck() {
    deckCards = [...document.querySelectorAll(".meals .meal")];
    if (reduce) { deckCards.forEach(el => { el.style.setProperty("--lie", "0"); el.style.opacity = "1"; }); return; }
    seekDeck();
  }

  window.MPM_STAGE = {
    afterRender(S) {
      if (S.view === "landing") mountHero();
      if (S.view === "app") mountDeck(); else deckCards = [];
    }
  };
})();

</script>

  /* -------------------------------------------------------------------
     5. CALCULATIONS
  ------------------------------------------------------------------- */
  const r = (n, d = 0) => { const m = Math.pow(10, d); return Math.round(n * m) / m; };

  function toKg(weight, unit) { return unit === "lb" ? weight * 0.45359237 : weight; }
  function toCm(h, unit, inches) {
    if (unit === "cm") return h;
    return (h * 12 + (inches || 0)) * 2.54;
  }

  function bmr(sex, kg, cm, age) {
    // Mifflin-St Jeor (most accurate population equation per ADA review)
    const base = 10 * kg + 6.25 * cm - 5 * age;
    return sex === "male" ? base + 5 : base - 161;
  }

  function computeTargets(p) {
    const kg = toKg(+p.weight, p.weightUnit);
    const cm = toCm(+p.height, p.heightUnit, +p.heightIn || 0);
    const age = +p.age;
    const diet = DIETS[p.diet] || DIETS.balanced;
    const goal = GOALS[p.goal] || GOALS.maintain;
    const act = ACTIVITY[p.activity] || ACTIVITY.moderate;

    const BMR = bmr(p.sex, kg, cm, age);
    const TDEE = BMR * act.mult;
    let kcal = TDEE * (1 + goal.pct);

    // Safety floors (Academy of Nutrition & Dietetics guidance)
    const floor = p.sex === "male" ? 1500 : 1200;
    const warnings = [];
    if (kcal < floor) { kcal = floor; warnings.push("Calories raised to the safe minimum of " + floor + " kcal/day."); }
    if (kcal < BMR && goal.pct < 0) { kcal = Math.max(kcal, BMR * 0.95); warnings.push("Deficit softened so you are not eating far below your resting metabolism."); }
    if (p.calorieOverride && +p.calorieOverride >= 1000) { kcal = +p.calorieOverride; }
    kcal = Math.round(kcal / 10) * 10;

    // Protein: g per kg of a reference weight. If BMI >= 30 we use the
    // weight at BMI 27 as reference so protein is not inflated by fat mass.
    const bmi = kg / Math.pow(cm / 100, 2);
    const refKg = bmi >= 30 ? 27 * Math.pow(cm / 100, 2) : kg;
    let pFactor = diet.proteinFactor ? Math.max(diet.proteinFactor, goal.proteinFactor) : goal.proteinFactor;
    if (p.diet === "keto") pFactor = Math.min(pFactor, 1.8);
    if (p.diet === "vegan" || p.diet === "vegetarian") pFactor = Math.max(1.6, pFactor);
    let protein = refKg * pFactor;
    protein = Math.min(protein, kcal * 0.40 / 4); // never more than 40% of calories

    let carbs, fat, netCarbCap = null;
    if (diet.carbCapG !== undefined && diet.carbCapG <= 30) {
      // keto / carnivore: carbs fixed, fat fills
      carbs = diet.carbCapG;
      fat = (kcal - protein * 4 - carbs * 4) / 9;
      netCarbCap = diet.carbCapG;
    } else {
      fat = Math.max(kcal * diet.pct[2] / 100 / 9, 0.6 * refKg); // fat floor 0.6 g/kg for hormones
      carbs = (kcal - protein * 4 - fat * 9) / 4;
      if (diet.carbCapG && carbs > diet.carbCapG) {
        carbs = diet.carbCapG;
        fat = (kcal - protein * 4 - carbs * 4) / 9;
      }
      if (carbs < 50 && !diet.carbCapG) { // rebalance if protein+fat crowd out carbs
        carbs = 50; fat = (kcal - protein * 4 - carbs * 4) / 9;
      }
    }
    const fiber = p.diet === "keto" || p.diet === "carnivore" ? (p.diet === "carnivore" ? 0 : 20) : Math.round(14 * kcal / 1000);
    const water = Math.round(kg * 35 / 50) * 50; // ml
    const goalWeightLb = null;

    const mealsPerDay = Math.min(6, Math.max(2, +p.mealsPerDay || 3));
    const slots = MEAL_SPLITS[mealsPerDay].map(([name, share]) => ({
      name, share,
      kcal: Math.round(kcal * share / 5) * 5,
      protein: r(protein * share),
      carbs: r(carbs * share),
      fat: r(fat * share)
    }));

    return {
      kg: r(kg, 1), cm: r(cm), bmi: r(bmi, 1),
      bmr: Math.round(BMR), tdee: Math.round(TDEE),
      kcal, protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat),
      fiber, waterMl: water, netCarbCap,
      proteinPerKg: r(protein / kg, 2),
      pct: {
        protein: Math.round(protein * 4 / kcal * 100),
        carbs: Math.round(carbs * 4 / kcal * 100),
        fat: Math.round(fat * 9 / kcal * 100)
      },
      slots, warnings, goalNote: goal.note, dietLabel: diet.label
    };
  }

     6. RULE SETS -> forbidden keyword list for a profile
  ------------------------------------------------------------------- */
  function forbiddenWords(profile) {
    const diet = DIETS[profile.diet] || DIETS.balanced;
    const words = new Set(diet.forbid);
    (profile.allergies || []).forEach(a => (ALLERGENS[a]?.words || []).forEach(w => words.add(w)));
    (profile.customAvoid || "").split(/[,\n;]+/).map(s => s.trim().toLowerCase()).filter(s => s.length > 1).forEach(w => words.add(w));
    return [...words];
  }

  // Word-boundary match so "egg" won't hit "eggplant" unless eggplant itself is listed,
  // and "pepper" won't flag "black pepper" (seasoning exemption).
  // [phrase, genericWordItShields]. A phrase is only exempted when the rest of
  // the phrase (minus the shielded word) is itself allowed — so "almond milk"
  // is fine for a dairy allergy but still flagged for a tree-nut allergy.
  const EXEMPT = [
    ["black pepper", "pepper"], ["white pepper", "pepper"], ["peppercorn", "pepper"], ["lemon pepper", "pepper"], ["red pepper flakes", "pepper"], ["chili flakes", "chili"], ["chili powder", "chili"],
    ["butter lettuce", "butter"], ["peanut butter", "butter"], ["almond butter", "butter"], ["cashew butter", "butter"], ["sunflower seed butter", "butter"], ["sunflower butter", "butter"], ["seed butter", "butter"], ["nut butter", "butter"], ["cocoa butter", "butter"], ["coconut butter", "butter"], ["apple butter", "butter"], ["plant-based butter", "butter"], ["plant based butter", "butter"], ["vegan butter", "butter"],
    ["almond milk", "milk"], ["oat milk", "milk"], ["soy milk", "milk"], ["coconut milk", "milk"], ["cashew milk", "milk"], ["rice milk", "milk"], ["pea milk", "milk"], ["hemp milk", "milk"], ["flax milk", "milk"], ["macadamia milk", "milk"], ["plant milk", "milk"], ["plant-based milk", "milk"], ["nut milk", "milk"], ["milk alternative", "milk"],
    ["coconut yogurt", "yogurt"], ["almond yogurt", "yogurt"], ["soy yogurt", "yogurt"], ["oat yogurt", "yogurt"], ["plant-based yogurt", "yogurt"], ["dairy-free yogurt", "yogurt"],
    ["coconut cream", "cream"], ["cashew cream", "cream"], ["cream of tartar", "cream"], ["cream of coconut", "cream"], ["oat cream", "cream"],
    ["vegan cheese", "cheese"], ["cashew cheese", "cheese"], ["dairy-free cheese", "cheese"], ["nutritional yeast", "yeast"],
    ["almond extract", "almond"], ["vanilla extract", "vanilla"], ["nutmeg", "nut"], ["eggplant", "egg"], ["garlic powder", "garlic"], ["onion powder", "onion"],
    ["rice vinegar", "rice"], ["rice paper", "rice"], ["cauliflower rice", "rice"], ["rice wine vinegar", "rice"], ["coconut aminos", "coconut"], ["sesame-free", "sesame"], ["egg-free", "egg"], ["dairy-free", "dairy"], ["gluten-free", "gluten"], ["nut-free", "nut"], ["sugar-free", "sugar"], ["soy-free", "soy"], ["peanut-free", "peanut"], ["wheat-free", "wheat"], ["grain-free", "grain"],
    ["sweet potato", "potato"], ["potato starch", "potato"], ["shea", "shea"], ["corn tortilla", "tortilla"], ["lettuce wrap", "wrap"], ["collard wrap", "wrap"], ["seaweed wrap", "wrap"], ["gluten-free bread", "bread"], ["gluten-free pasta", "pasta"], ["chickpea pasta", "pasta"], ["lentil pasta", "pasta"], ["zucchini noodles", "noodles"], ["rice noodles", "noodles"], ["shirataki noodles", "noodles"], ["kelp noodles", "noodles"], ["almond flour", "flour"], ["coconut flour", "flour"], ["chickpea flour", "flour"], ["oat flour", "flour"], ["cassava flour", "flour"], ["tapioca flour", "flour"], ["rice flour", "flour"], ["buckwheat", "wheat"], ["bone broth", "bone"]
  ];

  EXEMPT.sort((a, b) => b[0].length - a[0].length); // longest phrases first

  function wordRe(w) { return new RegExp("(^|[^a-z])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|es)?([^a-z]|$)", "i"); }

  function findViolations(ingredientNames, profile) {
    const forb = forbiddenWords(profile);
    const forbRes = forb.map(w => [w, wordRe(w)]);
    const hits = [];
    for (const raw of ingredientNames) {
      const name = String(raw || "").toLowerCase();
      let test = name, hit = null;
      for (const [phrase, generic] of EXEMPT) {
        if (!test.includes(phrase)) continue;
        // the phrase itself is explicitly forbidden (e.g. keto forbids "sweet potato")
        if (forb.includes(phrase)) { hit = phrase; break; }
        // the non-generic part is forbidden (e.g. "almond milk" with a tree-nut allergy)
        const rest = phrase.replace(generic, " ");
        const bad = forbRes.find(([w, re]) => w !== generic && re.test(rest));
        if (bad) { hit = bad[0]; break; }
        test = test.split(phrase).join(" ");

      if (!hit) { const f = forbRes.find(([, re]) => re.test(test)); if (f) hit = f[0]; }
      if (hit) hits.push({ ingredient: raw, word: hit });
    }
    return hits;
  }

  function sumMacros(meals) {
    return meals.reduce((a, m) => {
      const mm = m.macros || {};
      a.kcal += +mm.kcal || 0; a.protein += +mm.protein || 0; a.carbs += +mm.carbs || 0; a.fat += +mm.fat || 0; a.fiber += +mm.fiber || 0;
      return a;
    }, { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
  }

  // Check a day's meals against targets. Returns {ok, issues[]}
  function checkDay(meals, targets, profile, opts = {}) {
    const issues = [];
    const tol = opts.tol || 0.10;
    const tot = sumMacros(meals);
    if (Math.abs(tot.kcal - targets.kcal) / targets.kcal > tol) issues.push(`Day calories ${Math.round(tot.kcal)} vs target ${targets.kcal} (must be within ${Math.round(tol * 100)}%).`);
    if (tot.protein < targets.protein * 0.90) issues.push(`Day protein ${Math.round(tot.protein)} g is below target ${targets.protein} g.`);
    if (targets.netCarbCap !== null && (tot.carbs - tot.fiber) > targets.netCarbCap + 5) issues.push(`Net carbs ${Math.round(tot.carbs - tot.fiber)} g exceed cap of ${targets.netCarbCap} g.`);
    // per-meal internal consistency: kcal ≈ 4P + 4C + 9F (±15%)
    meals.forEach(m => {
      const mm = m.macros || {};
      const calc = 4 * (+mm.protein || 0) + 4 * (+mm.carbs || 0) + 9 * (+mm.fat || 0);
      if (mm.kcal && Math.abs(calc - mm.kcal) / mm.kcal > 0.15) issues.push(`"${m.name}": stated ${mm.kcal} kcal but macros compute to ${Math.round(calc)} kcal.`);
    });
    const names = meals.flatMap(m => (m.ingredients || []).map(i => i.item));
    const v = findViolations(names, profile);
    v.forEach(h => issues.push(`FORBIDDEN ingredient "${h.ingredient}" (matches "${h.word}").`));
    return { ok: issues.length === 0, issues, totals: tot, violations: v };
  }

  function checkMeal(meal, slotTarget, targets, profile) {
    const issues = [];
    const mm = meal.macros || {};
    if (Math.abs((+mm.kcal || 0) - slotTarget.kcal) / slotTarget.kcal > 0.15) issues.push(`Meal calories ${mm.kcal} vs slot target ${slotTarget.kcal} (within 15%).`);
    if ((+mm.protein || 0) < slotTarget.protein * 0.80) issues.push(`Meal protein ${mm.protein} g below slot target ${slotTarget.protein} g.`);
    const calc = 4 * (+mm.protein || 0) + 4 * (+mm.carbs || 0) + 9 * (+mm.fat || 0);
    if (mm.kcal && Math.abs(calc - mm.kcal) / mm.kcal > 0.15) issues.push(`Stated ${mm.kcal} kcal but macros compute to ${Math.round(calc)} kcal.`);
    const v = findViolations((meal.ingredients || []).map(i => i.item), profile);
    v.forEach(h => issues.push(`FORBIDDEN ingredient "${h.ingredient}" (matches "${h.word}").`));
    return { ok: issues.length === 0, issues, violations: v };
  }

  /* -------------------------------------------------------------------
     7. MEAL PLAN MAN — SYSTEM PROMPT (the chef's training)
  ------------------------------------------------------------------- */
  function profileSummary(p, t) {
    const diet = DIETS[p.diet] || DIETS.balanced;
    const allergyLabels = (p.allergies || []).map(a => ALLERGENS[a]?.label || a);
    const lines = [
      `Client: ${p.name || "Client"}, ${p.sex}, ${p.age} y, ${t.kg} kg / ${t.cm} cm (BMI ${t.bmi}).`,
      `Goal: ${GOALS[p.goal]?.label || p.goal}. Activity: ${ACTIVITY[p.activity]?.label || p.activity}.`,
      `Dietary protocol: ${diet.label}.`,
      `Allergies/intolerances (ABSOLUTE — never include, not even traces or "optional" garnish): ${allergyLabels.length ? allergyLabels.join(", ") : "none"}.`,
      `Dislikes / foods to avoid: ${p.customAvoid || "none"}.`,
      `Cuisine preferences: ${(p.cuisines || []).join(", ") || "any"}.`,
      `Cooking skill/time: ${p.cookTime || "moderate"}; Budget: ${p.budget || "moderate"}; Meals per day: ${t.slots.length}.`,
      p.notes ? `Extra notes from client: ${p.notes}` : ""
    ];
    return lines.filter(Boolean).join("\n");
  }

  function systemPrompt(p, t) {
    const diet = DIETS[p.diet] || DIETS.balanced;
    const forb = forbiddenWords(p);
    const ref = FOOD_REF.map(f => `${f[0]}: ${f[1]} kcal, P${f[2]} C${f[3]} F${f[4]} Fib${f[5]}`).join("\n");
    return `You are MEAL PLAN MAN — a registered-dietitian-level nutrition expert and professional chef. You write precise, delicious, realistic meal plans that hit macro targets and obey every dietary rule without exception.

== CLIENT ==
${profileSummary(p, t)}

== DAILY TARGETS (set by the dietitian engine; do not change them) ==
Calories ${t.kcal} kcal | Protein ${t.protein} g | Carbs ${t.carbs} g | Fat ${t.fat} g | Fiber ≥ ${t.fiber} g${t.netCarbCap !== null ? ` | NET CARBS ≤ ${t.netCarbCap} g/day (hard cap)` : ""}
Per-meal targets:
${t.slots.map(s => `- ${s.name}: ${s.kcal} kcal, P ${s.protein} g, C ${s.carbs} g, F ${s.fat} g`).join("\n")}

== PROTOCOL RULES: ${diet.label} ==
${diet.rules}

== FORBIDDEN INGREDIENT KEYWORDS (an automated validator rejects any meal containing these words in an ingredient) ==
${forb.length ? forb.join(", ") : "none"}

== HOW YOU WORK ==
1. Allergen safety first. Think about hidden sources (whey in protein powder, soy in tamari, wheat in soy sauce, egg in mayo, fish in Worcestershire/Caesar, nuts in pesto, dairy in ranch). If the protocol or allergy forbids it, it does not appear anywhere — not as garnish, not as "optional".
2. Macro accuracy. Compute each meal's macros from ingredient GRAMS using the reference table below (per 100 g). Calories must equal 4×protein + 4×carbs + 9×fat within ±10%. Scale portions (grams) up or down to land within ±10% of each slot's calorie target and at or above its protein target. Use realistic portion sizes (a chicken breast is 150-250 g cooked; 1 tbsp oil = 14 g = 124 kcal — count every oil, nut butter, cheese and dressing).
3. Real cooking. Give specific quantities (grams AND household measure), clear numbered steps a beginner can follow, realistic prep/cook times, and simple techniques appropriate to the client's cooking time preference. Season properly (salt, pepper, acid, herbs, spices). Vary proteins, cuisines, textures and cooking methods across the week; never repeat a dinner within the same week unless meal-prep batching is explicitly requested.
4. Nutrient quality. Include a vegetable or fruit at most meals, fiber sources (but keep daily fiber under roughly 2× the target — on high-calorie plant-based plans lean on grains, oils, nut/seed butters, tofu/tempeh, fruit and smoothies rather than piling on legumes, which causes GI distress), and micronutrient coverage appropriate to the protocol (e.g., iron/B12 attention for vegan, omega-3 for anti-inflammatory, potassium/low sodium for DASH, electrolytes for keto).
5. Snacks are simple (≤ 3 ingredients, ≤ 5 minutes) unless the client has lots of cooking time.
6. Grocery-friendly. Name ingredients the way they appear on a store shelf, with a category: Produce, Protein, Dairy & Eggs, Pantry, Grains & Bread, Frozen, Spices & Condiments, Beverages.
7. Output is JSON only — no markdown fences, no commentary outside the JSON.

== INGREDIENT REFERENCE (per 100 g: kcal, protein, carbs, fat, fiber) ==
${ref}

== MEAL JSON SHAPE ==
{"slot":"Breakfast","name":"...","description":"one appetizing sentence","prepMin":10,"cookMin":15,"servings":1,
 "ingredients":[{"item":"chicken breast","qty":"6 oz","grams":170,"category":"Protein"}],
 "instructions":["step 1","step 2"],
 "macros":{"kcal":520,"protein":42,"carbs":45,"fat":18,"fiber":8},
 "tags":["high-protein","30-min"],"mealPrepTip":"optional short tip"}`;
  }

  function dayPrompt(dayNum, usedNames, targets, extra) {
    return `Create DAY ${dayNum} of the plan: exactly ${targets.slots.length} meals in this order: ${targets.slots.map(s => s.name).join(", ")}.
Meal names already used this week (do NOT repeat any of these, and vary the protein/cuisine from them): ${usedNames.length ? usedNames.join("; ") : "none yet"}.
${extra ? "Additional instruction: " + extra : ""}
Day totals must land within ±10% of ${targets.kcal} kcal and at or above ${targets.protein} g protein.
Return JSON: {"day":${dayNum},"theme":"short theme like 'Mediterranean Monday'","meals":[...${targets.slots.length} meal objects...],"chefNote":"one sentence of coaching for the day"}`;
  }

  function swapPrompt(slot, oldMeal, usedNames, targets, request) {
    return `Replace ONE meal. Slot: ${slot.name}. Slot targets: ${slot.kcal} kcal, P ${slot.protein} g, C ${slot.carbs} g, F ${slot.fat} g (hit ±15% kcal and ≥ 80% protein).
The meal being replaced is "${oldMeal?.name || "n/a"}" — make the new one meaningfully different (different main protein or cuisine or cooking method).
Other meal names in the plan (avoid repeating): ${usedNames.join("; ") || "none"}.
${request ? "Client's request for the replacement: " + request : "No special request — surprise them with something they'd love."}
Return exactly one meal object as JSON (the MEAL JSON SHAPE), nothing else.`;
  }

  function fixPrompt(issues) {
    return `Your previous answer failed validation:\n- ${issues.join("\n- ")}\nFix every issue (adjust gram portions to correct macros, replace any forbidden ingredient with a compliant alternative, recompute macros from grams) and return the corrected JSON only.`;
  }

  function chatSystem(p, t, planSummary) {
    return `You are MEAL PLAN MAN, the client's personal dietitian-chef inside their meal plan app. Answer briefly, warmly and practically (2-6 sentences, or a short list). You know the client's profile and their current plan; refer to it specifically. Never suggest anything containing their allergens or that breaks their protocol. For medical conditions, remind them to confirm changes with their doctor.

== CLIENT ==
${profileSummary(p, t)}
Daily targets: ${t.kcal} kcal, P ${t.protein} g, C ${t.carbs} g, F ${t.fat} g, fiber ${t.fiber} g.

== CURRENT PLAN ==
${planSummary}`;
  }

  /* -------------------------------------------------------------------
     8. GROCERY AGGREGATION
  ------------------------------------------------------------------- */
  const CATEGORY_ORDER = ["Produce", "Protein", "Dairy & Eggs", "Grains & Bread", "Pantry", "Frozen", "Spices & Condiments", "Beverages", "Other"];
  function normalizeItem(s) {
    return String(s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/\b(fresh|large|small|medium|boneless|skinless|chopped|diced|minced|sliced|cooked|raw|organic|low-sodium|unsweetened|plain)\b/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  }
  function buildGrocery(days) {
    const map = new Map();
    days.forEach(d => (d.meals || []).forEach(m => (m.ingredients || []).forEach(ing => {
      const key = normalizeItem(ing.item);
      if (!key) return;
      const cat = CATEGORY_ORDER.includes(ing.category) ? ing.category : "Other";
      const g = +ing.grams || 0;
      if (!map.has(key)) map.set(key, { key, item: ing.item, category: cat, grams: 0, qtys: [], count: 0 });
      const e = map.get(key);
      e.grams += g; e.count += 1; if (ing.qty) e.qtys.push(ing.qty);
    })));
    const groups = {};
    [...map.values()].sort((a, b) => a.item.localeCompare(b.item)).forEach(e => {
      (groups[e.category] = groups[e.category] || []).push(e);
    });
    return CATEGORY_ORDER.filter(c => groups[c]).map(c => ({ category: c, items: groups[c] }));
  }
  function fmtGrams(g) {
    if (!g) return "";
    if (g >= 1000) return (g / 1000).toFixed(1) + " kg";
    const oz = g / 28.35;
    return Math.round(g) + " g (" + (oz >= 16 ? (oz / 16).toFixed(1) + " lb" : oz.toFixed(1) + " oz") + ")";
  }

  global.MPM = {
    DIETS, ALLERGENS, FOOD_REF, ACTIVITY, GOALS, MEAL_SPLITS, CATEGORY_ORDER,
    computeTargets, forbiddenWords, findViolations, sumMacros, checkDay, checkMeal,
    systemPrompt, dayPrompt, swapPrompt, fixPrompt, chatSystem, profileSummary,

  };
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* =====================================================================
   MEAL PLAN MAN — App (UI, storage, AI orchestration)

(function () {
  "use strict";
  const M = window.MPM;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const A = window.MPM_ASSETS || { logo: "", mark: "" };

  /* ------------------------------------------------------------------
     STATE
  ------------------------------------------------------------------ */
  const S = {
    view: "landing", tab: "plan", step: 0, dayIdx: 0,

    profile: null, targets: null, plans: [], plan: null,
    draft: null, gen: null, busyMeal: null, chatBusy: false, toast: null

  const DEFAULT_PROFILE = {
    name: "", sex: "male", age: "", weight: "", weightUnit: "lb", height: "", heightIn: "", heightUnit: "ft",
    goal: "lose", activity: "moderate", diet: "balanced", allergies: [], customAvoid: "", cuisines: [],

  let saveTimer = null;

  /* ------------------------------------------------------------------
     AI (Meal Plan Man via claude.use("sample"))
  ------------------------------------------------------------------ */
  function parseJSON(text) {
    if (text && typeof text === "object") return text;

  async function ask(system, messages, { tier = "default", signal } = {}) {
    const sample = S.caps.sample;
