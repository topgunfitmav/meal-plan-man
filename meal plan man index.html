  function humanErr(e) {

    return e?.message || String(e);
  }

  // Generate one day with validation + one correction round-trip
  async function generateDay(dayNum, usedNames, extra, signal) {
    const sys = M.systemPrompt(S.profile, S.targets);

    let text = await ask(sys, msgs, { signal });
    let day = normalizeDay(parseJSON(text), dayNum);
    let check = M.checkDay(day.meals, S.targets, S.profile);
    if (!check.ok) {
      msgs.push({ role: "assistant", content: JSON.stringify(day) }, { role: "user", content: M.fixPrompt(check.issues) });
      try {
        text = await ask(sys, msgs, { signal });
        const fixed = normalizeDay(parseJSON(text), dayNum);

  }
  function normalizeDay(obj, dayNum) {

  }
  function normalizeMeal(m, slotName) {
    const num = v => { const n = parseFloat(v); return isFinite(n) ? Math.round(n) : 0; };
    const mm = m.macros || {};
    return {
      id: uid(), slot: slotName, name: String(m.name || "Untitled meal"), description: String(m.description || ""),
      prepMin: num(m.prepMin), cookMin: num(m.cookMin), servings: num(m.servings) || 1,
      ingredients: (m.ingredients || []).map(i => ({ item: String(i.item || ""), qty: String(i.qty || ""), grams: num(i.grams), category: String(i.category || "Other") })),
      instructions: (m.instructions || []).map(String),
      macros: { kcal: num(mm.kcal), protein: num(mm.protein), carbs: num(mm.carbs), fat: num(mm.fat), fiber: num(mm.fiber) },
      tags: (m.tags || []).map(String).slice(0, 5), mealPrepTip: String(m.mealPrepTip || "")
    };
  }
  async function generateSwap(dayIdx, mealIdx, request) {
    const slot = S.targets.slots[mealIdx];
    const old = S.plan.days[dayIdx].meals[mealIdx];
    const used = S.plan.days.flatMap(d => d.meals.map(m => m.name)).filter(n => n !== old.name);
    const sys = M.systemPrompt(S.profile, S.targets);
    const msgs = [{ role: "user", content: M.swapPrompt(slot, old, used, S.targets, request) }];
    let meal = normalizeMeal(parseJSON(await ask(sys, msgs)), slot.name);
    let check = M.checkMeal(meal, slot, S.targets, S.profile);
    if (!check.ok) {
      msgs.push({ role: "assistant", content: JSON.stringify(meal) }, { role: "user", content: M.fixPrompt(check.issues) });
      try { const fixed = normalizeMeal(parseJSON(await ask(sys, msgs)), slot.name); const c2 = M.checkMeal(fixed, slot, S.targets, S.profile); if (c2.issues.length <= check.issues.length) { meal = fixed; check = c2; } } catch (e) { console.warn(e); }
    }
    if (check.violations.length) throw new Error("The replacement still contained a forbidden ingredient (" + check.violations.map(v => v.ingredient).join(", ") + "). Kept your original meal — try the swap again.");
    meal.flags = check.issues;
    return meal;
  }

  /* ------------------------------------------------------------------
     PLAN GENERATION ORCHESTRATION
  ------------------------------------------------------------------ */
  const COOK_LINES = ["Sharpening knives…", "Weighing out the protein…", "Balancing the macros…", "Checking every ingredient against your allergies…", "Taste-testing in my head…", "Writing the grocery list…", "Plating it up…"];
  async function generatePlan({ days, extra } = {}) {
    const n = days || +S.profile.planDays || 7;
    const ctrl = new AbortController();
    const plan = { id: uid(), createdAt: Date.now(), title: (S.targets.dietLabel) + " · " + n + "-day plan", days: [], targets: S.targets, profile: JSON.parse(JSON.stringify(S.profile)), groceryChecked: {}, chat: [] };
    S.gen = { active: true, done: 0, total: n, msg: COOK_LINES[0], ctrl, error: null };
    S.plan = plan; S.dayIdx = 0; S.tab = "plan"; S.view = "app"; render();
    try {
      for (let d = 1; d <= n; d++) {
        S.gen.msg = COOK_LINES[(d - 1) % COOK_LINES.length] + " (Day " + d + " of " + n + ")"; renderGenStatus();
        const used = plan.days.flatMap(x => x.meals.map(m => m.name));
        const day = await generateDay(d, used, extra, ctrl.signal);
        plan.days.push(day); S.gen.done = d;
        if (d === 1) { S.plans.unshift({ id: plan.id, createdAt: plan.createdAt, title: plan.title, days: n, kcal: S.targets.kcal, diet: S.targets.dietLabel }); await Store.saveMeta(); }
        await Store.savePlan(plan);
        render();
      }
      toast("Your " + n + "-day plan is ready. Enjoy!");
    } catch (e) {
      if (ctrl.signal.aborted) { toast("Stopped. Kept the days already cooked."); }
      else { S.gen.error = humanErr(e); console.error(e); }
      if (plan.days.length) { const i = S.plans.find(p => p.id === plan.id); if (i) i.days = plan.days.length; else S.plans.unshift({ id: plan.id, createdAt: plan.createdAt, title: plan.title, days: plan.days.length, kcal: S.targets.kcal, diet: S.targets.dietLabel }); await Store.saveMeta(); await Store.savePlan(plan); }
      else { S.plan = null; }
    } finally { S.gen.active = false; render(); }
  }
  async function regenerateDay(dayIdx, extra) {
    const ctrl = new AbortController();
    S.gen = { active: true, done: dayIdx, total: S.plan.days.length, msg: "Re-cooking Day " + (dayIdx + 1) + "…", ctrl, error: null, single: true }; render();
    try {
      const used = S.plan.days.filter((_, i) => i !== dayIdx).flatMap(x => x.meals.map(m => m.name));
      const day = await generateDay(dayIdx + 1, used, extra, ctrl.signal);
      S.plan.days[dayIdx] = day; await Store.savePlan(S.plan); toast("Day " + (dayIdx + 1) + " refreshed.");
    } catch (e) { if (!ctrl.signal.aborted) toast(humanErr(e), true); }
    finally { S.gen.active = false; render(); }
  }

  async function sendChat(text) {
    if (!text.trim() || !S.plan || S.chatBusy) return;
    S.plan.chat = (S.plan.chat || []).slice(-30); S.plan.chat.push({ role: "user", content: text.trim() }); S.chatBusy = true; render(); scrollChat();
    try {
      const summary = S.plan.days.map(d => `Day ${d.day} (${d.theme}): ` + d.meals.map(m => `${m.slot}: ${m.name} [${m.macros.kcal} kcal, P${m.macros.protein}]`).join("; ")).join("\n");
      const sys = M.chatSystem(S.profile, S.targets, summary);
      const hist = S.plan.chat.slice(-8).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
      const reply = await ask(sys, hist, { tier: "quick" });
      S.plan.chat.push({ role: "assistant", content: reply.trim() });
    } catch (e) { S.plan.chat.push({ role: "assistant", content: "Sorry — " + humanErr(e) }); }
    S.chatBusy = false; queueSavePlan(); render(); scrollChat();
  }

  /* ------------------------------------------------------------------
     EVENTS
  ------------------------------------------------------------------ */
  let bound = false;
  function bindCommon() {
    if (bound) return; bound = true;
    const r = document.body;
    r.onclick = async e => {
      const b = e.target.closest("[data-act],[data-set],[data-toggle],[data-tab],[data-day],[data-meal],[data-open-plan],[data-del-plan],[data-sugg],[data-week]");
      if (!b) return;
      const d = b.dataset;
      if (d.set) {
        readDraftInputs();
        const dr = S.draft, v = d.val;
        if (d.set === "weightUnit" && dr.weightUnit !== v) { if (dr.weight) dr.weight = v === "kg" ? Math.round(+dr.weight * 0.4536) : Math.round(+dr.weight / 0.4536); }
        if (d.set === "heightUnit" && dr.heightUnit !== v) {
          if (v === "cm" && dr.height) { dr.height = Math.round((+dr.height * 12 + (+dr.heightIn || 0)) * 2.54); dr.heightIn = ""; }
          else if (v === "ft" && dr.height) { const inches = +dr.height / 2.54; dr.height = Math.floor(inches / 12); dr.heightIn = Math.round(inches % 12); }
        }
        dr[d.set] = (d.set === "mealsPerDay" || d.set === "planDays") ? +v : v;
        render(); return;
      }
      if (d.toggle) { const arr = S.draft[d.toggle]; const i = arr.indexOf(d.val); i >= 0 ? arr.splice(i, 1) : arr.push(d.val); render(); return; }
      if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); return; }
      if (d.day !== undefined && !d.act) { S.dayIdx = +d.day; render(); return; }
      if (d.meal !== undefined && !d.act) { openModal(mealModal(S.dayIdx, +d.meal)); return; }
      if (d.week !== undefined) { const target = S.plans.find(x => x.program && x.program.week === +d.week); if (target) { const full = await Store.loadPlan(target.id); if (full) { S.plan = full; S.targets = full.targets; S.dayIdx = 0; await Store.saveMeta(); render(); window.scrollTo(0, 0); } } return; }
      if (d.openPlan) { const full = await Store.loadPlan(d.openPlan); if (!full) return toast("Couldn't load that plan.", true); S.plan = full; S.targets = full.targets; S.profile = full.profile || S.profile; S.dayIdx = 0; S.tab = "plan"; await Store.saveMeta(); render(); return; }
      if (d.delPlan) { if (!(await confirmBox("Delete this plan? This can't be undone."))) return; S.plans = S.plans.filter(p => p.id !== d.delPlan); await Store.deletePlan(d.delPlan); if (S.plan?.id === d.delPlan) S.plan = null; await Store.saveMeta(); render(); return; }
      if (d.sugg) { $("#chatIn").value = d.sugg; sendChat(d.sugg); return; }
      switch (d.act) {
        case "focus-login": { const f = $("#clientEmail"); if (f) { f.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => f.focus(), 400); } break; }
        case "start": S.draft = JSON.parse(JSON.stringify(S.profile || DEFAULT_PROFILE)); S.step = 0; S.view = "onboard"; render(); window.scrollTo(0, 0); break;
        case "edit-profile": S.draft = JSON.parse(JSON.stringify(S.profile)); S.step = 0; S.view = "onboard"; S.editing = true; render(); break;
        case "go-home": S.view = "landing"; render(); window.scrollTo(0, 0); break;
        case "open-app": S.view = "app"; render(); break;
        case "back": readDraftInputs(); if (S.step === 0) { S.view = S.plan || S.profile ? "app" : "landing"; S.editing = false; } else S.step--; render(); window.scrollTo(0, 0); break;
        case "next": await nextStep(); break;
        case "stop-gen": S.gen?.ctrl?.abort(); break;
        case "retry-gen": generatePlan(); break;
        case "new-week": { const extra = await promptBox("Any direction for the new plan? (optional)", "e.g. more variety, cheaper, batch-cook friendly, Asian flavors"); if (extra === null) return; generatePlan({ extra }); break; }
        case "regen-day": { const extra = await promptBox("What should change about Day " + (S.dayIdx + 1) + "? (optional)", "e.g. quicker breakfast, no fish, use leftovers"); if (extra === null) return; regenerateDay(S.dayIdx, extra); break; }
        case "swap": { const req = $("#swapReq")?.value || ""; closeModal(); doSwap(+d.day, +d.meal, req); break; }
        case "copy-recipe": copy(recipeText(S.plan.days[+d.day].meals[+d.meal])); break;
        case "copy-grocery": copy(groceryText()); break;
        case "copy-plan": copy(planText()); break;
        case "clear-checks": S.plan.groceryChecked = {}; queueSavePlan(); render(); break;
        case "send-chat": { const v = $("#chatIn").value; sendChat(v); break; }
        case "reset-all": if (await confirmBox("Erase your profile and all saved plans?")) { for (const p of S.plans) await Store.deletePlan(p.id); S.plans = []; S.plan = null; S.profile = null; S.targets = null; await Store.saveMeta(); LS.del("meta"); S.view = "landing"; render(); } break;
      }
    };
    document.addEventListener("submit", async e => {
      if (e.target.id !== "clientForm") return; e.preventDefault();
      const email = $("#clientEmail").value.trim().toLowerCase(); const err = $("#clientErr"); err.textContent = "";
      const btn = e.target.querySelector("button"); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Opening…';
      try { const ok = await loadClient(email); if (!ok) { err.textContent = "I don't have a program under that email. Double-check the spelling, or ask your coach."; } }
      catch (ex) { err.textContent = "Couldn't open the program: " + (ex.message || ex); }
      btn.disabled = false; btn.textContent = "Open my program →";
    });
    r.onchange = e => {
      const g = e.target.dataset?.gkey; if (g !== undefined) { S.plan.groceryChecked = S.plan.groceryChecked || {}; if (e.target.checked) S.plan.groceryChecked[g] = 1; else delete S.plan.groceryChecked[g]; e.target.closest(".gitem").classList.toggle("done", e.target.checked); Store.savePlan(S.plan); }
    };
    r.onkeydown = e => { if (e.key === "Enter" && e.target.id === "chatIn") sendChat(e.target.value); if (e.key === "Enter" && e.target.dataset?.in && S.view === "onboard") { e.preventDefault(); nextStep(); } };
    r.oninput = e => { if (e.target.dataset?.in) S.draft[e.target.dataset.in] = e.target.value; };
  }
  // 3D tilt + sheen on any [data-tilt] element — delegated once, no re-binding per render
  (function tilt() {
    if (window.matchMedia("(hover: none)").matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const MAX = 7;
    document.addEventListener("pointermove", e => {
      const el = e.target.closest && e.target.closest("[data-tilt]"); if (!el) return;
      const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      el.classList.add("tilting"); el.style.setProperty("--lie", "0");
      el.style.transform = `rotateX(${(0.5 - py) * MAX * 2}deg) rotateY(${(px - 0.5) * MAX * 2}deg) translateY(-3px)`;
      el.style.setProperty("--px", px * 100 + "%"); el.style.setProperty("--py", py * 100 + "%");
    }, { passive: true });
    document.addEventListener("pointerout", e => { const el = e.target.closest && e.target.closest("[data-tilt]"); if (el && !el.contains(e.relatedTarget)) { el.style.transform = ""; setTimeout(() => el.classList.remove("tilting"), 160); } });
  })();
  function readDraftInputs() { document.querySelectorAll("[data-in]").forEach(el => { S.draft[el.dataset.in] = el.value; }); }
  async function nextStep() {
    readDraftInputs();
    const d = S.draft;
    if (S.step === 0) {
      const e = $("#err");
      const age = +d.age, w = +d.weight, h = +d.height;
      if (!(age >= 18 && age <= 100)) return e.textContent = "Enter an age between 18 and 100 (Meal Plan Man is for adults).";
      if (!(w > 60 && (d.weightUnit === "lb" ? w < 700 : w < 320))) return e.textContent = "Enter a realistic weight.";
      if (d.heightUnit === "ft" ? !(h >= 3 && h <= 8) : !(h >= 100 && h <= 250)) return e.textContent = "Enter a realistic height.";
    }
    if (S.step < STEPS.length - 1) { S.step++; render(); window.scrollTo(0, 0); return; }
    // finish
    S.profile = JSON.parse(JSON.stringify(d)); S.targets = M.computeTargets(S.profile);
    const wasEditing = S.editing; S.editing = false;
    await Store.saveMeta();
    if (wasEditing && S.plan) {
      const ok = await confirmBox("Profile saved. Cook a new plan with the updated targets now?", "Cook new plan", "Keep current plan");
      if (!ok) { S.view = "app"; S.tab = "profile"; render(); return; }
    }
    generatePlan();
  }
  async function doSwap(dayIdx, mealIdx, req) {
    const m = S.plan.days[dayIdx].meals[mealIdx]; S.busyMeal = m.id; render();
    try {
      const nm = await generateSwap(dayIdx, mealIdx, req);
      S.plan.days[dayIdx].meals[mealIdx] = nm;
      const c = M.checkDay(S.plan.days[dayIdx].meals, S.targets, S.profile); S.plan.days[dayIdx].flags = c.issues; S.plan.days[dayIdx].violations = c.violations.length;
      await Store.savePlan(S.plan); toast("Swapped in: " + nm.name);
    } catch (e) { toast(humanErr(e), true); }
    S.busyMeal = null; render();
  }

  /* ---- modal / toast / prompts ---- */
  function openModal(html) { closeModal(); const w = document.createElement("div"); w.id = "modal"; w.innerHTML = html; document.body.appendChild(w); w.addEventListener("click", e => { if (e.target.dataset.close) closeModal(); }); document.body.style.overflow = "hidden"; }
  function closeModal() { $("#modal")?.remove(); document.body.style.overflow = ""; }
  function confirmBox(text, yes = "Yes", no = "Cancel") {
    return new Promise(res => { openModal(`<div class="modal-bg"><div class="modal" style="max-width:420px"><h2 style="font-size:20px">${esc(text)}</h2><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="mb-no">${esc(no)}</button><button class="btn primary" id="mb-yes">${esc(yes)}</button></div></div></div>`); $("#mb-yes").onclick = () => { closeModal(); res(true); }; $("#mb-no").onclick = () => { closeModal(); res(false); }; });
  }
  function promptBox(text, ph) {
    return new Promise(res => { openModal(`<div class="modal-bg"><div class="modal" style="max-width:460px"><h2 style="font-size:20px">${esc(text)}</h2><textarea class="field" id="mb-in" style="margin-top:12px" placeholder="${esc(ph || "")}"></textarea><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="mb-no">Cancel</button><button class="btn primary" id="mb-yes">Go 👨‍🍳</button></div></div></div>`); $("#mb-yes").onclick = () => { const v = $("#mb-in").value; closeModal(); res(v); }; $("#mb-no").onclick = () => { closeModal(); res(null); }; $("#mb-in").focus(); });
  }
  let toastTimer;
  function toast(text, bad) { $("#toast")?.remove(); const t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.style.background = bad ? "#a0472a" : ""; t.textContent = text; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 3000); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied to clipboard."); } catch { openModal(`<div class="modal-bg" data-close="1"><div class="modal"><button class="close" data-close="1">✕</button><h2 style="font-size:20px">Copy this</h2><textarea class="field" style="min-height:300px;margin-top:10px">${esc(text)}</textarea></div></div>`); } }

  /* ------------------------------------------------------------------
     CLIENT PROGRAMS (pre-cooked by the coach, shipped with the app)
  ------------------------------------------------------------------ */
  async function sha256(str) {
    try { if (crypto?.subtle) { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); } } catch { }
    return sha256js(str);
  }
  // pure-JS SHA-256 fallback for contexts without crypto.subtle
  function sha256js(ascii) {
    const rr = (v, a) => (v >>> a) | (v << (32 - a)); const mp = Math.pow; const mh = mp(2, 32); let res = ""; const words = []; const len = ascii.length * 8; let hash = sha256js.h = sha256js.h || [], k = sha256js.k = sha256js.k || [], pc = k.length; const ic = {};
    for (let cand = 2; pc < 64; cand++) { if (!ic[cand]) { for (let i = 0; i < 313; i += cand) ic[i] = cand; hash[pc] = (mp(cand, .5) * mh) | 0; k[pc++] = (mp(cand, 1 / 3) * mh) | 0; } }
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = (len / mh) | 0; words[words.length] = len;
    for (let j = 0; j < words.length;) { const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
      for (let i = 0; i < 64; i++) { const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] + (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0; }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0; }
    for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; res += (b < 16 ? 0 : "") + b.toString(16); }
    return res;
  }
  function fmtRange(start, weekIdx) { const a = new Date(start + "T00:00:00"); a.setDate(a.getDate() + weekIdx * 7); const b = new Date(a); b.setDate(a.getDate() + 6); const f = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); return f(a) + " – " + f(b); }
  async function loadClient(email) {
    const key = await sha256(email);
    const c = (window.MPM_CLIENTS || {})[key]; if (!c) return false;
    S.profile = JSON.parse(JSON.stringify(c.profile)); S.targets = c.targets;
    // one plan per week; keep ids stable so device-saved swaps/checkmarks survive a reload
    const existing = new Set(S.plans.map(p => p.id));
    const plans = [];
    for (let i = 0; i < c.weeks.length; i++) {
      const id = "client_" + key.slice(0, 8) + "_w" + (i + 1);
      const program = { client: c.name, week: i + 1, totalWeeks: c.weeks.length, start: c.startDate, range: fmtRange(c.startDate, i) };
      const title = (c.name.split(" ")[0]) + "'s " + c.targets.dietLabel + " · Week " + (i + 1);
      const saved = existing.has(id) ? await Store.loadPlan(id) : null;
      const plan = saved || { id, createdAt: Date.now(), title, days: c.weeks[i].days, targets: c.targets, profile: S.profile, groceryChecked: {}, chat: [] };
      plan.program = program; plan.title = title; plan.targets = c.targets;
      if (!saved) await Store.savePlan(plan);
      plans.push({ id, createdAt: plan.createdAt, title, days: plan.days.length, kcal: c.targets.kcal, diet: c.targets.dietLabel, program });
    }
    S.plans = [...plans, ...S.plans.filter(p => !plans.some(q => q.id === p.id))];
    // open the week that matches today's date (week 1 before the start date, last week after the end)
    const start = new Date(c.startDate + "T00:00:00"); const wk = Math.min(c.weeks.length, Math.max(1, Math.floor((Date.now() - start) / (7 * 864e5)) + 1));
    S.plan = await Store.loadPlan(plans[wk - 1].id); S.dayIdx = Math.min(6, Math.max(0, Math.floor((Date.now() - start) / 864e5) - (wk - 1) * 7));
    await Store.saveMeta();
    S.view = "app"; S.tab = "plan"; render(); window.scrollTo(0, 0);
    toast("Welcome, " + c.name.split(" ")[0] + "! Your program is loaded.");
    return true;
  }

  /* ------------------------------------------------------------------
     BOOT
  ------------------------------------------------------------------ */
  async function boot() {
    render();
    // Resolve capabilities (each may be null). Never block render on them.
    const use = async name => { try { return window.claude?.use ? await window.claude.use(name) : null; } catch (e) { console.warn("use(" + name + ")", e); return null; } };
    const [user, db, sample] = STATIC ? [null, null, null] : await Promise.all([use("user"), use("db"), use("sample")]);
    S.caps.user = user; S.caps.db = db; S.caps.sample = sample;
    if (user && db) { try { S.caps.userId = await user.id(); } catch { } }
    S.caps.mode = S.caps.userId && db ? "db" : "local";
    // Load saved state
    let meta = await Store.loadMeta();
    if (!meta && S.caps.mode === "db") meta = LS.get("meta"); // migrate a browser-only profile into the account
    if (meta) {
      S.profile = meta.profile || null; S.plans = meta.plans || []; if (S.profile) S.targets = M.computeTargets(S.profile);
      const pid = meta.activePlanId || S.plans[0]?.id;
      if (pid) { const full = await Store.loadPlan(pid) || LS.get("plan_" + pid); if (full) { S.plan = full; S.targets = full.targets || S.targets; } }
      if (S.caps.mode === "db" && !(await Store.metaRef().get()).exists) { await Store.saveMeta(); if (S.plan) await Store.savePlan(S.plan); }
    }
    S.caps.ready = true;
    if (S.plan || S.profile) { S.view = "app"; S.tab = S.plan ? "plan" : "profile"; }
    render();
  }
  boot();
})();

</script>
